<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a1622">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="صندوقي">
    <meta name="robots" content="noindex">
    <meta name="author" content="DoniaLink · Yousif Shakir">
    <link rel="preload" href="{{ASSET}}/fonts/IBMPlexSansArabic-400.woff2" as="font" type="font/woff2" crossorigin>
    <title>صندوق المالك</title>
    <link rel="manifest" href="/ecc/owner/manifest.webmanifest">
    <link rel="icon" type="image/png" href="{{ASSET}}/favicon-32.png">
    <link rel="apple-touch-icon" href="{{ASSET}}/icon-180.png">
    <link rel="stylesheet" href="{{ASSET}}/app.css?v={{VERSION}}">
</head>
<body>
    <div id="offline" class="offline" hidden></div>
    <main id="app" aria-live="polite">
        <div class="splash"><div class="spinner"></div></div>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="{{ASSET}}/app.js?v={{VERSION}}"></script>
